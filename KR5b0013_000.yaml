body:
  text: 太上洞玄靈寶開演袐密藏經人十一太上大道君以上皇元年十月五日與無量天真妙行神人詣太微帝君處明霞之上瓊闕之內金華之房諸天上帝淸齋道前旋行步虛誦詠靈章一依俯仰三乘之格扣擊法鼓普集羣真此時衆聖莫不皆集敷講玄妙闡揚道德聖衆列位四座嚴整太微帝君從座而起稽首道君今日大慶教誡之晨迂屈聖尊曲降卑肆洪慈垂眄過忝重思賤臣小子希遭嘉會羣真歡樂不並於常伏願哀憐覺所未悟不審三世十方天尊所得妙身以何為法為同一體為各異耶唯願哀矜真垂敷演令一切衆生及將來世學道之人有所依倚緣恩上啓伏用戰惶太上道君方命西臺金母三十二天齊聲合和唱詠靈音鼓天妓樂表現祥瑞驚天駭地妙麗殊特良久言曰深乎微哉乃欲問發真道袐藏自我成道巳來未曾説此隱奧之事今既有請冒禁相傳當諦聽受勿妄宣泄是時衆會伏受要言太上告曰至真妙理寂絶無形清淨凝湛不可言名方便引化略開二途一者道身寂體盧無二者生身誕孕形軀言道身者離一切相正慧成滿除斷虛妄冥契玄宗與道為一不滅不生無來無去言語路斷念慮永畢言生身者隨順世法依因父母氣數和合瓊胎靈府猶如虛空隨宜出處年月不同腋背降誕長養深宫或生而皓素或常保少容瓌姿妙質天人所宗帝君禮曰不審道身即是寂本為更有義名為本耶太上告曰道為聖本本即道根雖是一體先無二源道名獨立體自靈通強字無待遠逝息功本對於末因待假名稱為物始用涉能生又為定本動寂用殊出沒豆表語默相須帝君又問如是本身能生萬物即是萬物之本始者此與神本有何差别太上答曰源其實體無有二相何以故俱畢竟故無始終故不可説故以善方便亦得言異所謂神本是妄想初一念之心能為一切生死根本以是初心念念相續衆生業果輪轉無窮是名識初亦名神本言本身者即是道情清淨之心能為一切世出世法之根本故故名為本如是真性非心不心非色不色無緣慮故非無常故故言非心能生心故無不知故亦名為心無所礙故故名非色能生色故道眠見故亦名為色是清淨心具足一切無量功德智慧成就常住自在湛然安樂但為煩惱所覆蔽故未得顯了故名為性若修方便斷諸煩惱障法盡故顯現明了故名本身如此身者本自有之非今造故故名為本本非有性非三世攝方便説故非非三世本來有故名為過去一切來生必定嘗得故名未來十方大聖今巳得故故名現在雖復説有三世差別體不動故常住無變帝君又問若是本身性是具足一切煩惱云何能障若本具足而起障者一切神尊得成道亦巳應還失何以故體唯一故太上答曰雖體是一義則有二方便未足故方便具足故是故我言一切諸法以空為性為化來生善巧方便隨宣演説是言説性猶如虛空亦無分别識本本身皆虛空相得無所得故無所失有所得故故有所失是故凡夫名為失者十方神尊名為常德帝君又問若生死法無始無終本性清淨何故不名為道果耶太上答曰生死之法有因果故故是無常不名道果常道之體非因果故是故為常體是果故故名道果帝君又問如是本身為悉共有但是一身為各各有有無量身若有一者一人得巳應礙餘人若是多迹非為太一不得言常太上曰我不説言一切諸法如虛空耶虛空之性非一非多非礙非無礙如是本身亦復如是體非一多性無障礙太微帝君稽首謝曰謹聞命矣不審生之與迹二義云何經門二言敢以咨啓伏願弘慈廣垂分别太上告曰體實無二隨義名身生體擢貌事事同人迹無定相形不常倫但能顯本即是迹陳帝君又問生身遭身是應作耶太上答曰如是如是生之與迹並稱機緣利益不差即名為應體則無别隨義異名帝君又問是迹身者為有法耶為無法耶太上答曰我不説云一切諸法性無所有云何迹身而當有法若假名字亦有亦無不離本故故名為無衆生見故故名為有更非别體故名為無有實利益故名為有猶如明鏡能見色象了了分明種種差别是鏡中象不可定説是有是無而亦得言鏡中有像一切衆生心鏡明故見真道像又如止水無濤波故影現日月星辰飛鳥日月星辰及以飛鳥悉見水底一切諸物亦見自影了了分明此水中物及所見影俱非真實不可言有不可言無一切衆生心水澄淸見道身影亦復如是體即真道是故非有非不見故不得言無如追逝者尋迹能得是迹與人非一非異迹身亦爾明解之人用迹入悟見真道身知無迹法故名為一非不因迹漸得開曉建立福田是名為異如是之義是道境界非是凡夫下聖能了於是道君欲顯斯義重説偈言道身不生滅任理自玄通湛然常清淨獨立強言空絶名無待對亦忘造物功端靜息義用蕭寂守虛沖本身為物始生立布三才冥功雖叵測圓照逐念開能為妙迹本表見億萬該神用無起滅竒功靡去來生身託父母寄慧示同凡瓊胎非世孕變示適所堪端嚴使欣慕白首破迷貪非是骨肉身隨願之所覃權迹無定方見身亦長久遍示五道形姿容順妍醜任本之所垂利益無優貌乍有變化生時或因父毋太微帝君稽首又曰敢問道身為有因耶為無因耶若有因者同世間法因緣生故故是無常若無因生復墮邪見異道之謂若是道身不從因生自然有者一切衆生不修道者應皆成道如是二義云何可了唯願慈愍廣垂開示道君答曰太微帝君乃能顯發如是深奧微密之義夫正道者真實之相非言語法之所能宣今言道者寄言顯示令得悟入解了無言忘筌取旨勿著文字所言道者通達無礙猶如虛空非有非無非愚非智非因非果非凡非聖非色非心非相非非相即一切法亦無所即何以故一切法性即是無性法性道性俱畢竟空是空亦空空空亦空空無分别分別空故是無分别亦復皆空空無二故故言其即而諸衆生不能解了如是義故於無法中而生法想於不空中而生空想以有如是心想倒故而有見著具是四倒妄造諸法計我及物故名生死不得道身天尊大聖了此實性畢竟無性洞會道源混體冥一故名得道身與道一故名道身習此正觀名之曰因亦無所習故名非因是故正道非從因生亦非無因體非是果亦非非果非常非非常非滅非非滅如是深奧祕密之義唯性與道乃能解知上聖真仙皆不通達以信力故髣佛能知如是身者住無所住無所不住是名正道真實之身帝君又曰不審天尊所受生身業相云何太上告曰所言生者無生不生離一切生何以故十方天尊生巳盡故染欲無明永清淨故故無有生欲利衆生示同世法是故有生何以故我若説云道氣髙遠寂滅不生衆生便謂不可修習無回向心不修善業是故説云一切聖人皆有生果然非結業隨願故生若復相説隨人天生皆以上業而為生因以於其中最第一故是名分别生身之相太微帝君稽首禮曰善哉道君演説如是深奧之義自昔以來未曾得聞如是妙經譬如薄福重罪之人生而聾盲不見五色青黃赤白及黑等相不聞宫商五音之聲有大明翳授以妙術為開耳目一切色聲無不聞見我亦如是聞於是經能得聞見二種身相當知是經是法耳目其有得者能見正道二種法身權實之趣大明醫者即是道君示我妙經如施耳目得此教者即得正道微妙之身得道身巳便能隨順示見生身是經能生二種身故名為法母何以故是深如教能今一切生真法身如世慈母能生子故至孝之子常念鞠育懷抱之恩思欲上報終天無極我等如是因是正教生無漏身是故常當報恩供養安置堂殿七寶莊嚴香花燈燭伎樂幡蓋晨夕朝禮如侍所親太上道君答帝君曰如是如是實如所説我從昔來未曾為人説如是法何以故是諸學者力未堪故非是我等十方天尊有所隱覆有所吝惜所演法言皆表一道一味一相而諸衆生各得悟入深淺差別隨解有異名為别教示其一相故曰同歸無異經也譬如天降一味甘雨江河大海受處不同名為異水雨實唯一十方大聖降一法雨隨三乘器受益不同故名三教所示身相亦復如是於未悟者名為未説於解了者常滿究竟是故我等無所祕藏是時太微帝君及諸太衆聞是法音歎未曾有於虛空中兩天妙花鼓天伎樂供養道君而共齊聲説偈歎曰我等歸命太上尊無上最勝真法王巧説二種微妙身猶如等降甘露雨三乘得悟有差別道君所説皆周普衆生泛此法舟航免度生死大河苦服此清淨良法藥身心垢穢病皆愈各蒙法利喜充遍是故禮謝慈悲父爾時太微帝君及諸大衆説是偈巳白太上言若諸神尊所説諸法同表一道無淺深者云何而得有圓滿教及未具了差别趣耶道君告曰若於大聖諸有所言皆是正觀一切智心無非畢竟悉是了義隨衆生故半滿不同為鈍根者或時説有或時説空或時説常或説無常是名兩半前後異説不得一時隨病發故偏示一義是名為牛前病除巳復顯一藥用具足故名之為滿了兩半巳入一中道乃名具足圓滿之相若深智者聞説一邊即應了悟因緣假名即正中道所言中者離一切著亦無所離不滯二邊故名為中能通衆生至善家處到解脫城故名為中若有了如是中道者名為正觀是第一乘能運學者出離三界過二生死了真法性成無上道是故此經能破無邊無明暗室令見無上正法珍寶猶如明燈破一切暗令有目者見諸寶物隨意更用稱心快樂我今哀愍暗苦衆生然此法燈照煩惱暗普令一切尋光見道得真智慧自在安樂極無上果究竟升玄太微帝君白太上曰若如是者唯當正解中道之要便得成道何須更習諸餘經誡為繁勞耶太上告曰若諸學人深蘊德本了達正空中道之相是即具足無俟更修諸餘法術但為五濁諸衆生等未了此經深妙之趣先示餘法調伏其心遮斷煩惱四魔惡賊猶如帝王具足無量珍寶樂具而須城舍墻塹莊嚴防斷盜賊遮諸障難如是正觀始悟心王住中道城以諸誠慧為法墻塹牢自莊嚴備諸魔試是故十方天尊大聖具演經誠廣開法門太微帝君稽首拜曰敢問道君畢竟究竟云何差別願垂告示太上曰畢者決也竟者定也我所説法決定無二如言世間無常若空空無我淨道果常臻安樂自在真實清淨若異學者有來難問如是之義終不動轉三世神尊皆作是説是決定畢竟之義又復畢者名審竟者名諦若諸道君説一切法本性清淨如虛空性假因緣有體非真實中道之理性無顛倒是寂滅相作是説者審諦誠信無有虛妄是故復名畢竟之義又復畢者名達竟者言了十方大聖坐道場時證深正智於一切法及法真性一念洞明通達照了無有差謬是智圓滿稱實相法達了無遺故名畢竟言究竟者究之言到竟之言邊際十方神尊得一切智到法邊際是名究竟又復究者名斷竟者名盡一切神尊以實相慧斷煩惱習一切皆盡具足解脫是明究竟又復究者名度竟者名巳十方大聖得道真人度生死海巳至彼岸故名究竟如此是名分别畢竟究竟差别之相帝君又曰當何名此經云何傳授方法所須願垂具告太上曰此經名為開演祕密之藏所以者何此經明於三世十方得道神尊微密妙身袐藏之義如我等比無上法王出此五濁化諸衆生三業示見方便善巧意趣微隱難可了知所以爾者十方天尊所得之身即真道相體合自然無形無名非造作法如虛空相無數劫來久證此法同一性相平等無二而能出見種種法身示修習報應化無方人天惡道隨類所見受生業行皆同其法或見殊勝超踰世間第一希有獨步無畏威變自在不可思議是名開演身袐密藏能於正道真實之性無言無説寂滅相中善巧因緣分別顯示隨其所宜説法無盡言辭次第義味深賾或説一乘或説三乘人天業果漸漸開化使得同歸真一正道是名開演口祕密藏雖無念慮離分别想以一切智洞達空門正解正觀窮理邊底與真實相平等為一以一切種智照世間法色法非色法心法非心法人天五道四大六家衆生想念果報因緣於一念中明了無礙善識根性隨宜所行世出祕法洞達究盡是名開演心祕密藏以是三種祕密之法成真道身非是凡夫乃至上聖所能覺知我於是經具開此義明説身相啓方便門令諸學者入重玄趣是故此經名為開演祕密奧藏如是受持此經大乘衆經中最妙若有至心堪能解了講宣其義審得其人稽首而傳不須盟信何以故巳受餘經知其心故亦是平等無揀擇故太微帝君拜手言曰善哉道君演説如是深奧之義我於今日始知神尊審是衆生真實父母能以大慈大悲之力於無相中示真法相説此三種微密之趣令諸來生悟一乘道得妙法身證無上覺自能了知祕密之藏亦當能為一切衆生開演甚深三種微密我今始知無上大乘平等正法無擇穢賤唯授能行有心之人輕當傳付令此妙教廣得流道普令一切開正法眼紹繼道君無上之位使三寶輪轉運照無輟太上告曰善哉帝君乃能發心弘宣此法來生男女當受斯慶咸見正道得淨法身帝君當知若使餘經不流布者於諸世間無深損害若失此經一勾一偈則為一切構諸災禍何以故此經明示真道正身即是衆生終歸窟宅若失此經永為孤露流漂三塗五道之中沒於長苦無由解脫何以故不得本源無所歸故是故帝君常當一心弘宣此法必使流通我昔受之於太帝太帝受之於五帝上真髙上玉皇玉皇受之於玉清帝君消魔大王大王受之於八天虛皇帝君口口相傳不記文字帝君今可書而録之使得流布將來衆生吾當以神通力守護此經隨有之處悉皆吉祥大劫之周餘道皆滅此經獨存當還大羅之天隨機下世救度天人於是太微帝君鐫玉為簡鏤金為字編以白銀撰録此經盛以紫玉之函封於七寶之臺仙童玉女散花燒香供養靈文是時大衆聞受經巳太上道君還於玉京諸來會者各禮而去太上洞玄靈寶開演祕密藏經終
